; Suggested PHP limits for cPanel. Hosts may ignore this file.
upload_max_filesize = 25M
post_max_size = 32M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
date.timezone = UTC
expose_php = Off
display_errors = Off
log_errors = On
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
